{{- $config := include "lgtm.gatewayConfig" . -}}
# Gateway OTLP: a porta de entrada dos projetos. Recebe traces, métricas e logs e repassa
# cada sinal ao backend certo, MANTENDO o tenant (X-Scope-OrgID) que o projeto mandou.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  labels: {{- include "lgtm.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {{- include "lgtm.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      nodePort: {{ .Values.nodePorts.gateway }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "lgtm.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
      annotations:
        checksum/config: {{ $config | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: {{ .Values.imagens.gateway }}
          args: ["--config=/etc/gateway/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: saude, containerPort: 13133 }
          readinessProbe:
            httpGet: { path: /, port: saude }
          livenessProbe:
            httpGet: { path: /, port: saude }
          resources:
            {{- toYaml .Values.recursos.gateway | nindent 12 }}
          securityContext:
            {{- include "lgtm.seguranca" . | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/gateway }
      volumes:
        - name: config
          configMap: { name: gateway-config }

{{- define "lgtm.gatewayConfig" -}}
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true # guarda os cabeçalhos da requisição (inclui o tenant)

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Repassa o tenant recebido para os backends.
  headers_setter:
    headers:
      - action: upsert
        key: X-Scope-OrgID
        from_context: x-scope-orgid

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  # Agrupa por tenant: um lote nunca mistura dados de projetos diferentes.
  batch:
    metadata_keys: [x-scope-orgid]
    metadata_cardinality_limit: 50

exporters:
  otlphttp/mimir:
    endpoint: http://mimir:9009/otlp
    auth: { authenticator: headers_setter }
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
    auth: { authenticator: headers_setter }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    auth: { authenticator: headers_setter }

service:
  extensions: [health_check, headers_setter]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/mimir]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
{{- end }}
