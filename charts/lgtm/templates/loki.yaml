{{- $config := include "lgtm.lokiConfig" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels: {{- include "lgtm.labels" . | nindent 4 }}
data:
  loki.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: {{- include "lgtm.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
{{ include "lgtm.monolito" (dict
    "root" .
    "nome" "loki"
    "imagem" .Values.imagens.loki
    "args" (list "-config.file=/etc/loki/loki.yaml")
    "portas" (list (dict "nome" "http" "porta" 3100))
    "montagemDados" "/loki"
    "recursos" .Values.recursos.loki
    "checksum" ($config | sha256sum)) }}

{{- define "lgtm.lokiConfig" -}}
# Loki monolítico e MULTI-TENANT (auth_enabled: o tenant vem no X-Scope-OrgID).
auth_enabled: true

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore: { store: inmemory }
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }

limits_config:
  allow_structured_metadata: true
  retention_period: {{ .Values.retencao.logs }}

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
{{- end }}
