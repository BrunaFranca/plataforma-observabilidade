# Cluster "obs": a plataforma de observabilidade compartilhada.
# Portas no PC (só 127.0.0.1): Grafana em 3300; entrada de dados exposta para depuração.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: obs
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300 # Grafana
        hostPort: 3300
        listenAddress: 127.0.0.1
      - containerPort: 30317 # gateway OTLP gRPC (entrada dos projetos)
        hostPort: 14317
        listenAddress: 127.0.0.1
      - containerPort: 30909 # Mimir (remote write, regras, consultas)
        hostPort: 19009
        listenAddress: 127.0.0.1
